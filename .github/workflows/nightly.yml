name: Nightly Cross-Browser Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        type: choice
        default: all
        options: [ all, chrome, firefox, edge ]
      groups:
        description: 'TestNG groups'
        type: choice
        default: regression
        options: [ regression, smoke ]
      env:
        description: 'Environment (config-{env}.properties)'
        type: string
        default: qa

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # On schedule the inputs context is empty, so the fallbacks below apply: all browsers.
        browser: ${{ fromJSON((inputs.browser == '' || inputs.browser == 'all') && '["chrome","firefox","edge"]' || format('["{0}"]', inputs.browser)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
          TEST_GROUPS: ${{ inputs.groups || 'regression' }}
          TEST_ENV: ${{ inputs.env || 'qa' }}
        run: >
          mvn -B -ntp clean test
          -Dbrowser="$BROWSER"
          -Dgroups="$TEST_GROUPS"
          -Denv="$TEST_ENV"
          -Dheadless=true

      - name: Checkout gh-pages (Allure history)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      # Must run AFTER the tests: BaseTest cleans target/allure-results in @BeforeSuite.
      - name: Prepare Allure history and categories
        if: ${{ !cancelled() }}
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p target/allure-results
          cp .github/allure/categories.json target/allure-results/categories.json
          if [ -d "gh-pages/nightly/$BROWSER/history" ]; then
            cp -r "gh-pages/nightly/$BROWSER/history" target/allure-results/history
          fi

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -ntp allure:report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/allure-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish nightly reports
    needs: test
    # Only from main: manual runs from other branches must not overwrite the public report.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Download Allure reports
        uses: actions/download-artifact@v8
        with:
          pattern: allure-report-*
          path: reports

      - name: Rename report folders (allure-report-chrome -> chrome)
        run: |
          for d in reports/allure-report-*; do
            [ -d "$d" ] || continue
            mv "$d" "reports/${d#reports/allure-report-}"
          done
          ls -1 reports

      # One step per browser: each publishes only its own subfolder, so a manual run
      # for a single browser does not erase the other browsers' reports.
      - name: Publish chrome
        if: ${{ hashFiles('reports/chrome/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/chrome
          destination_dir: nightly/chrome
          keep_files: false

      - name: Publish firefox
        if: ${{ hashFiles('reports/firefox/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/firefox
          destination_dir: nightly/firefox
          keep_files: false

      - name: Publish edge
        if: ${{ hashFiles('reports/edge/**') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/edge
          destination_dir: nightly/edge
          keep_files: false

      - name: Summary
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nightly"
          {
            echo "### Nightly Allure reports"
            echo "- $BASE/chrome/"
            echo "- $BASE/firefox/"
            echo "- $BASE/edge/"
          } >> "$GITHUB_STEP_SUMMARY"