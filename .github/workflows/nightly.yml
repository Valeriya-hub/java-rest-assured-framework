name: Nightly Cross-Browser Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        type: choice
        default: all
        options: [ all, chrome, firefox, edge ]
      groups:
        description: 'TestNG groups'
        type: choice
        default: regression
        options: [ regression, smoke ]
      env:
        description: 'Environment (config-{env}.properties)'
        type: string
        default: qa

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.set.outputs.browsers }}
    steps:
      - id: set
        env:
          BROWSER_INPUT: ${{ inputs.browser }}
        run: |
          if [ -z "$BROWSER_INPUT" ] || [ "$BROWSER_INPUT" = "all" ]; then
            echo 'browsers=["chrome","firefox","edge"]' >> "$GITHUB_OUTPUT"
          else
            echo "browsers=[\"$BROWSER_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (${{ matrix.browser }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.prepare.outputs.browsers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
          TEST_GROUPS: ${{ inputs.groups || 'regression' }}
          TEST_ENV: ${{ inputs.env || 'qa' }}
        run: >
          mvn clean test
          -Dbrowser="$BROWSER"
          -Dgroups="$TEST_GROUPS"
          -Denv="$TEST_ENV"
          -Dheadless=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/allure-report
          retention-days: 7